name: cws-status

# What does the Chrome Web Store actually think the state of our item is?
#
# The dashboard shows the *published* listing and hides the draft an API upload
# creates, which makes "did my upload land?" surprisingly hard to answer. This
# asks the API directly. Run it from the Actions tab; it changes nothing.
on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    # Same environment as the release job — that is where the CWS_* secrets live.
    environment: production
    steps:
      - name: Query item state
        env:
          EXT_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          token_response=$(curl -sS -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" \
            -d grant_type=refresh_token)
          TOKEN=$(jq -r '.access_token // empty' <<<"$token_response")
          if [ -z "$TOKEN" ]; then
            echo "::error::token request failed: $(jq -rc '{error,error_description}' <<<"$token_response")"
            exit 1
          fi

          for projection in DRAFT PUBLISHED; do
            echo "--- $projection"
            curl -sS -H "Authorization: Bearer $TOKEN" -H 'x-goog-api-version: 2' \
              "https://www.googleapis.com/chromewebstore/v1.1/items/$EXT_ID?projection=$projection" |
              jq '{crxVersion, uploadState, itemError}'
          done

          echo
          echo "crxVersion under DRAFT is the package waiting to be submitted."
          echo "If DRAFT already shows the new version, the upload worked and the"
          echo "remaining work is in the dashboard: complete the listing/privacy"
          echo "fields, then Submit for review."
